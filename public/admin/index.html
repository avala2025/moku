<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MOKU მართვა</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wdth,wght@62.5..100,300..500&display=swap">
<style>
/* მართვის სისტემა: ყოველთვის ღია, მაღაზიის ფერებში. ტელეფონზე დიდი ღილაკები. */
:root{--bg:#f2f0eb;--surface:#fbfaf7;--ink:#1d2729;--soft:#5f6b6d;--line:#dcd8cf;--accent:#56758a;--tile:#e9e4d8;--birch:#e9dfcd;
--new:#b58b56;--way:#56758a;--done:#5c8a5e;--bad:#b4533f;--ok-bg:#e4ecdf;--warn-bg:#f3e6d6;--bad-bg:#f3ddd6;
--display:"Noto Serif Georgian",Georgia,serif;--body:"Jost","Noto Sans Georgian","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1140px;margin-inline:auto;padding:18px clamp(16px,3vw,32px) 70px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Jost",sans-serif;font-size:19px;letter-spacing:.34em;font-weight:500}
.brand svg{width:22px;height:22px;flex:none}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;color:var(--soft)}
.tabs,.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button,.chips button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:14px}
.chips button{padding:7px 14px;font-size:13.5px}
.tabs button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
h1,h2{font-family:var(--display);font-stretch:84%;font-weight:400;line-height:1.2;margin:0}
h1{font-size:34px;margin-bottom:6px}
h2{font-size:25px;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--body);font-size:13px;color:var(--soft);letter-spacing:.06em}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--tile);border-radius:18px;padding:16px 18px;min-width:0}
.tile b{display:block;font-family:var(--display);font-stretch:84%;font-weight:400;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--soft)}.tile small{display:block;font-size:13px;margin-top:2px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.card.strip{border-left:4px solid var(--line)}
.card.s-new,.card.s-assigned{border-left-color:var(--new)}.card.s-picked{border-left-color:var(--way)}.card.s-delivered{border-left-color:var(--done)}.card.s-problem,.card.s-returned,.card.s-cancelled{border-left-color:var(--bad)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.top b{font-size:16px;font-weight:600}.top time,.top small{color:var(--soft);font-size:13px}
.pill{font-size:12px;border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--tile);color:var(--ink)}
.pill.new,.pill.assigned{background:var(--warn-bg);color:#7a5a2c}.pill.picked{background:#dde6ec;color:#3b5566}.pill.delivered,.pill.sent{background:var(--ok-bg);color:#3f6a42}.pill.returned,.pill.cancelled,.pill.problem,.pill.failed{background:var(--bad-bg);color:#8a3a2b}.pill.skipped,.pill.sending{color:var(--soft)}
.who{display:grid;gap:2px;font-size:14.5px;overflow-wrap:anywhere}
a{color:var(--accent)}
.items{margin:0;padding:8px 0 0;list-style:none;font-size:14.5px;border-top:1px solid var(--line);display:grid;gap:2px}
.items li,.sum{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum{font-weight:600}
.note{font-size:13.5px;color:var(--soft)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:99px;padding:10px 18px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:42px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.bad{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.big{padding:13px 24px;font-size:15.5px;min-height:50px}
.btn.wide{width:100%;justify-content:center}
.btn:disabled{opacity:.5}
.btn svg{width:16px;height:16px;flex:none}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:12.5px;color:var(--soft);min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;width:100%;min-width:0;min-height:44px}
.acts select{width:auto;max-width:220px}
.irow{display:grid;grid-template-columns:46px minmax(0,1fr) 76px 96px 38px;gap:8px;align-items:end}
.irow .th{width:46px;height:46px;border-radius:10px;overflow:hidden;background:var(--birch)}
.irow .th img{width:100%;height:100%;object-fit:cover;display:block}
.irow button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
@media(max-width:640px){.irow{grid-template-columns:46px minmax(0,1fr) 38px}.irow label:nth-child(3),.irow label:nth-child(4){grid-column:2/3}}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.stocklist{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14.5px}
.stocklist li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.stocklist img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--birch);flex:none}
.stocklist span:nth-child(2){flex:1;min-width:0}
.low{color:var(--bad);font-weight:600}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:720px}
th{font-size:12px;font-weight:500;color:var(--soft);text-align:right;padding:10px;white-space:nowrap}
td{border-top:1px solid var(--line);padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
td input{padding:7px 9px;min-height:38px}td input[type=number]{width:90px;text-align:right}
tfoot td{font-weight:600}
.msg{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:22px;color:var(--soft)}
.err{color:var(--bad);font-size:14px;min-height:1.5em;margin:0 0 6px}
.ok{color:var(--done)}
.hint{font-size:13.5px;color:var(--soft);margin:0 0 10px}
.login{max-width:380px;margin:10vh auto 0;display:grid;gap:14px}
.search{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search input{max-width:360px}
.found{font-size:13px;color:var(--done)}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13.5px}
.reasons button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daybar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;background:var(--tile);border-radius:14px;padding:10px 14px;font-size:14px}
.daybar b{font-size:16px}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:center;font-size:14.5px;border-top:1px solid var(--line);padding:8px 0}
.crow:first-of-type{border-top:0}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px}
.chk{display:flex;flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink);padding:6px 0;cursor:pointer}
.chk input{width:20px;height:20px;min-height:0;margin:0;flex:none;accent-color:var(--accent)}
details summary{cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><circle cx="13" cy="13" r="12"/><circle cx="12.4" cy="13.3" r="8"/><circle cx="11.9" cy="13.6" r="4.2"/><circle cx="11.6" cy="13.8" r="1" fill="currentColor"/></svg>MOKU</div>
    <div class="me" id="me" hidden></div>
  </header>
  <div class="tabs" id="tabs" role="group" aria-label="განყოფილება" hidden></div>
  <p class="err" id="err" role="status"></p>
  <main id="app"></main>
</div>
<script src="/admin/app.js"></script>
</body>
</html>
